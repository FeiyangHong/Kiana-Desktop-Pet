<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>琪亚娜 · 音乐动作对照</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#302e3d;background:#f6f4fa}body{max-width:900px;margin:32px auto;padding:0 20px}h1{font-size:24px}p{font-size:14px;line-height:1.7;color:#6d6979}button,select{font:inherit;border:1px solid #dcd5eb;border-radius:10px;background:#fff;padding:8px 12px;cursor:pointer}nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0}section{background:#fff;border:1px solid #e9e4f0;border-radius:18px;padding:14px;margin:18px 0;overflow:auto}h2{font-size:15px;margin:4px 8px}.row{display:grid;grid-template-columns:repeat(4,192px);gap:8px}.label{text-align:center;font-size:12px;color:#7b7488}canvas{display:block;width:192px;height:208px}.detail{display:none;margin:12px 8px}.detail canvas{width:285px;height:168px}.show-feet .detail{display:block}body.dark section{background:#1e2028;border-color:#303342}body.dark{background:#161820;color:#edeaf4}body.dark .label{color:#aaa6b5}.step{font-variant-numeric:tabular-nums;font-size:13px}footer{font-size:12px;color:#888;margin:24px 0}
</style>
<h1>音乐动作 · 原待机与实际播放对照</h1><p>每行依次为原待机、坐姿倾听、轻微挥棒、活力挥棒。坐姿两条小腿独立转动，2.4秒一个周期；可以放大脚部、慢放或逐帧核对。挥棒保留重心变化，轻微挥棒另有连续小幅身体轻摆。</p>
<nav><button id="pause">暂停</button><button id="step">前进50毫秒</button><button id="entry">重播坐下／起身</button><button id="background">切换深浅背景</button><label><input type="checkbox" id="feet">放大脚部</label><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速检查</option><option value="0.25">四分之一速度</option></select><span class="step" id="time"></span></nav><main id="main"></main>
<p>这里使用桌宠运行时导出的透明帧，未用透明度叠图伪造中间动作。预览不控制音乐、不修改设置。动作不与真实歌曲BPM同步。</p><footer>可在浏览器以100%、125%、150%、200%缩放查看。左右脚在经过同一位置时会自然遮挡，观察一个完整周期可看到前脚交换。</footer>
<script>
const skins=[['kiana-winter-wish-round','冬祈新愿'],['kiana-fiery-wishing-star-round','咚！炽愿吉星 · 原装'],['time-runner-kiana-round','时砾逐光']];
const main=document.getElementById('main'),durations=[[450,450,420,150,420,450],[240,240,240,240,240,240],[180,120,180,120,180,120]],rows=[];
function picture(url){const im=new Image();im.src=url;return im;}
for(const [skin,name] of skins){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=name;section.append(title);const row=document.createElement('div');row.className='row';const canvases=[];for(const text of ['原待机','坐姿 · 双腿交替','轻微挥棒','活力挥棒']){const cell=document.createElement('div'),label=document.createElement('div'),canvas=document.createElement('canvas');label.className='label';label.textContent=text;canvas.width=384;canvas.height=416;canvas.setAttribute('aria-label',name+' '+text);cell.append(label,canvas);row.append(cell);canvases.push(canvas);}const detail=document.createElement('div');detail.className='detail';const label=document.createElement('div');label.className='label';label.textContent='脚部放大：观察前后两个半周期';const legs=document.createElement('canvas');legs.width=570;legs.height=336;detail.append(label,legs);section.append(row,detail);main.append(section);rows.push({canvases,legs,idle:picture('../../assets/'+skin+'.png'),poses:picture('music-frames-'+skin+'.png'),seated:picture('music-seated-'+skin+'.png')});}
let paused=false,elapsed=0,last=performance.now(),transition=false;
function frame(action,ms){const times=durations[action];let t=Math.max(0,ms)%times.reduce((a,b)=>a+b,0);for(let i=0;i<6;i++){if(t<times[i])return action*6+i;t-=times[i];}return action*6;}
function paint(canvas,image,sx,sy,sw,sh,angle=0){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!image.complete||!image.naturalWidth)return;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(angle){ctx.translate(384*.46,384*1.03);ctx.rotate(angle*Math.PI/180);ctx.translate(-384*.46,-384*1.03);}ctx.drawImage(image,sx,sy,sw,sh,0,0,canvas.width,canvas.height);ctx.restore();}
function draw(){const moving=transition&&elapsed<720,ms=Math.max(0,elapsed-(transition?720:0)),q=Math.floor(ms%2400/50);for(const r of rows){paint(r.canvases[0],r.idle,0,0,192,208);for(let a=0;a<3;a++){if(a===0&&!moving){paint(r.canvases[1],r.seated,q%8*384,Math.floor(q/8)*416,384,416);}else{const f=moving?18+(a===0?Math.min(5,Math.floor(elapsed/120)):5-Math.min(5,Math.floor(elapsed/120))):frame(a,ms);paint(r.canvases[a+1],r.poses,f%6*384,Math.floor(f/6)*416,384,416,a===1&&!moving?1.1*Math.sin(ms*Math.PI*2/1440):0);}}paint(r.legs,r.seated,q%8*384+70,Math.floor(q/8)*416+300,190,112);}document.getElementById('time').textContent=moving?'坐下／起身过渡':(elapsed/1000).toFixed(2)+'秒 · 坐姿 '+(q+1)+'/48';}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续':'暂停';};document.getElementById('step').onclick=()=>{paused=true;elapsed+=50;document.getElementById('pause').textContent='继续';draw();};document.getElementById('entry').onclick=()=>{paused=false;elapsed=0;transition=true;document.getElementById('pause').textContent='暂停';};document.getElementById('background').onclick=()=>document.body.classList.toggle('dark');document.getElementById('feet').onchange=e=>document.body.classList.toggle('show-feet',e.target.checked);function tick(now){if(!paused)elapsed+=Math.min(100,now-last)*Number(document.getElementById('speed').value);last=now;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
