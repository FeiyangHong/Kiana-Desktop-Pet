<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>琪亚娜 · 音乐动作对照</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#302e3d;background:#f6f4fa}body{max-width:900px;margin:32px auto;padding:0 20px}h1{font-size:24px;margin-bottom:12px}p{font-size:14px;line-height:1.7;color:#6d6979}button,select{font:inherit;border:1px solid #dcd5eb;border-radius:10px;background:#fff;padding:8px 12px;cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}section{background:#fff;border:1px solid #e9e4f0;border-radius:18px;padding:14px;margin:18px 0;overflow:auto}h2{font-size:15px;font-weight:600;margin:4px 8px}.row{display:grid;grid-template-columns:repeat(4,192px);gap:8px}.label{text-align:center;font-size:12px;color:#7b7488}.pet{width:192px;height:208px;overflow:hidden;position:relative;flex:none}.pet img{position:absolute;max-width:none;width:1152px;height:832px;pointer-events:none;image-rendering:auto}.pet.base img{width:1536px;height:2288px}body.dark section{background:#1e2028;border-color:#303342}body.dark{background:#161820;color:#edeaf4}body.dark h2{color:#e4ddec}body.dark .label{color:#aaa6b5}.step{font-variant-numeric:tabular-nums}footer{font-size:12px;color:#888;margin:24px 0}
</style>
<h1>音乐动作 · 实际素材动态对照</h1><p>每行从左到右：原待机、侧坐倾听、轻微挥棒、活力挥棒。按桌宠192像素宽度显示；可在浏览器改变缩放检查清晰度。这里的挥棒节奏不跟随当前歌曲BPM。</p>
<nav><button id="pause">暂停</button><button id="step">下一帧</button><button id="entry">重播坐下／起身</button><button id="background">切换深浅背景</button><span class="step" id="time"></span></nav><main id="main"></main>
<p>设置中可将“平时播放时”设为“坐着听歌＋偶尔轻微应援”：约45秒坐姿、15秒轻微应援交替。“进入副歌时”独立选择，也可保持平时动作。没有副歌数据时继续平时动作。</p>
<footer>使用运行时导出的同一组校准帧。预览不连接或控制播放器，不修改桌宠设置。坐姿和起身的正式预览也可从桌宠设置中打开。</footer>
<script>
const skins=[['kiana-winter-wish-round','冬祈新愿'],['kiana-fiery-wishing-star-round','咚！炽愿吉星 · 原装'],['time-runner-kiana-round','时砾逐光']];
const main=document.getElementById('main'),durations=[[450,450,420,150,420,450],[280,180,280,180,280,180],[180,120,180,120,180,120]],pictures=[];
for(const [skin,name] of skins){const section=document.createElement('section');const title=document.createElement('h2');title.textContent=name;section.append(title);const row=document.createElement('div');row.className='row';for(let a=-1;a<3;a++){const cell=document.createElement('div');const label=document.createElement('div');label.className='label';label.textContent=['原待机','侧坐倾听','轻微挥棒','活力挥棒'][a+1];const pet=document.createElement('div');pet.className='pet'+(a<0?' base':'');const img=document.createElement('img');img.src=a<0?'../../assets/'+skin+'.png':'music-frames-'+skin+'.png';img.alt=name+' '+label.textContent;pet.append(img);cell.append(label,pet);row.append(cell);if(a>=0)pictures.push({img,a});}section.append(row);main.append(section);}
let paused=false,elapsed=0,last=performance.now(),transition=false,manual=-1;
function frame(action,ms){const times=durations[action];let t=ms%times.reduce((a,b)=>a+b,0);for(let i=0;i<6;i++){if(t<times[i])return action*6+i;t-=times[i];}return action*6;}
function draw(){for(const p of pictures){let f=manual>=0?p.a*6+manual:frame(p.a,elapsed);if(transition&&elapsed<720)f=18+(p.a===0?Math.min(5,Math.floor(elapsed/120)):5-Math.min(5,Math.floor(elapsed/120)));else if(transition&&manual<0)f=frame(p.a,elapsed-720);p.img.style.left=-(f%6)*192+'px';p.img.style.top=-Math.floor(f/6)*208+'px';}document.getElementById('time').textContent=manual>=0?'姿势 '+(manual+1)+' / 6':(elapsed/1000).toFixed(1)+' 秒';}
document.getElementById('pause').onclick=()=>{paused=!paused;manual=-1;document.getElementById('pause').textContent=paused?'继续':'暂停';};
document.getElementById('step').onclick=()=>{paused=true;transition=false;manual=(manual+1)%6;document.getElementById('pause').textContent='继续';draw();};
document.getElementById('entry').onclick=()=>{paused=false;manual=-1;elapsed=0;transition=true;document.getElementById('pause').textContent='暂停';};document.getElementById('background').onclick=()=>document.body.classList.toggle('dark');
function tick(now){if(!paused)elapsed+=Math.min(100,now-last);last=now;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
